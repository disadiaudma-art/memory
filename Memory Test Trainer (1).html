<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Test Trainer</title>
<style>
:root{--bg:#f5f4ef;--cd:#fff;--tx:#1c2230;--mu:#6a7282;--ac:#2f5bea;--ok:#1f8a4c;--bad:#c8372d;--bd:#e0ded5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161c;--cd:#1c212b;--tx:#e8eaf0;--mu:#9aa2b2;--ac:#6d93ff;--ok:#4cc27d;--bad:#ff7a70;--bd:#2e3542}}
:root[data-theme="dark"]{--bg:#13161c;--cd:#1c212b;--tx:#e8eaf0;--mu:#9aa2b2;--ac:#6d93ff;--ok:#4cc27d;--bad:#ff7a70;--bd:#2e3542}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:1.3rem;margin:0}h2{font-size:1.05rem;margin:0 0 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:9px 14px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);margin-top:10px}
.tb.on,.sg.on{background:var(--ac);color:#fff;border-color:var(--ac)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:.85rem}
.stage{background:var(--bg);border-radius:12px;padding:16px;margin:10px 0;text-align:center}
.chips span{display:inline-block;margin:4px;padding:6px 12px;border-radius:20px;background:var(--cd);border:1px solid var(--bd);font-size:1.1rem;text-transform:capitalize}
.big{font-size:2.2rem;letter-spacing:.2em;font-weight:700;word-break:break-all}
.pr{display:flex;justify-content:center;gap:12px;font-size:1.1rem;padding:3px;text-transform:capitalize}
.gr{display:grid;gap:6px;max-width:320px;margin:auto}.gr div,.gr select{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:var(--cd);border:1px solid var(--bd);border-radius:10px;width:100%}
.gr select{font-size:1.2rem}
textarea,input[data-a]{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
label{display:flex;gap:8px;align-items:center;margin:6px 0;text-transform:capitalize}label input{flex:1}
.sc{font-size:2.4rem;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.ch{width:100%;height:auto}.lg{font-size:.85rem;color:var(--mu)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.st div{background:var(--bg);border-radius:10px;padding:10px}.st b{font-size:1.4rem;display:block}
</style></head><body><div class="w">
<div class="top"><h1>🧠 Memory Test Trainer</h1><span class="mu" id="who"></span></div>
<nav id="nav"></nav><div id="app"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]),pick=(a,n)=>shuf(a).slice(0,n),R=a=>a[Math.floor(Math.random()*a.length)];
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null};
const W="apple river chair cloud tiger window garden pencil bridge silver forest button camel island lantern magnet orange planet rocket saddle temple violin whistle yellow zebra anchor blanket castle dragon engine feather glacier harbor jungle kitten ladder mango needle ocean pepper".split(" ");
W.push(..."carpet circle coffee copper corner cotton crystal desert doctor dolphin eagle farmer flower guitar hammer helmet jacket kettle lemon marble meadow mirror napkin orchid palace pillow pocket pumpkin quarry ribbon rabbit sandal school shadow spider sunset thunder tunnel valley velvet walnut".split(" "));
const OB="lamp kettle pencil mirror basket ladder candle bottle guitar helmet pillow wallet camera anchor compass ribbon".split(" ");
const NM="Ravi Anu Meera Sijo Nadia Arjun Fida Kiran Leela Hari Zoya Binu Tara Imran Devi".split(" ");
const EM=[..."🍎🚗⭐🐟🎈🔔🌵🎸🍄🐢🔑🌙🍋🚲🌸🐘🎩🍕⚽🔥🍇🐝🎂🌈"],CT="Kochi Kannur Thrissur Kollam Kozhikode Palakkad Munnar Alappuzha".split(" "),CO="red green blue white black pink orange yellow".split(" "),DY="Monday Tuesday Wednesday Thursday Friday Saturday Sunday".split(" "),IT="books chairs shirts tickets lamps bags plates caps".split(" ");
const J=c=>c=="Junior";
let lv=+ls("mt_lv")||1;const N=(j,s,h,x)=>lv==1?(J(cat)?j:s):lv==2?h:x;
function setLv(n){lv=n;ls("mt_lv",n);draw()}
const T={
words:{n:"Word list (read)",make:c=>{const k=N(8,14,50,70),it=pick(W,k);return{mem:k*(k>20?2.5:3)+5,show:`<div class="chips">${it.map(w=>`<span>${w}</span>`).join("")}</div>`,ask:`<textarea data-a rows="5" placeholder="Type the words you remember"></textarea>`,score(v){const s=new Set(v[0].toLowerCase().split(/[^a-z]+/));return{g:it.filter(w=>s.has(w)).length,m:k,key:it.join(", ")}}}}},
num:{n:"Number sequence (shown)",make:c=>{const k=N(6,9,16,24),s=Array.from({length:k},()=>Math.floor(Math.random()*10)).join("");return{mem:k*2+4,show:`<div class="big">${s}</div>`,ask:`<input data-a inputmode="numeric" placeholder="Type the digits in order">`,score(v){const x=v[0].replace(/\D/g,"");return{g:[...s].filter((d,i)=>x[i]==d).length,m:k,key:s}}}}},
pairs:{n:"Name and object pairs (read)",make:c=>{const k=N(4,7,12,15),n=pick(NM,k),o=pick(OB,k);return{mem:k*5+5,show:n.map((x,i)=>`<div class="pr"><b>${x}</b> → <span>${o[i]}</span></div>`).join(""),ask:n.map(x=>`<label>${x} <input data-a></label>`).join(""),score(v){return{g:o.filter((x,i)=>v[i].trim().toLowerCase()==x).length,m:k,key:n.map((x,i)=>x+" → "+o[i]).join(", ")}}}}},
grid:{n:"Picture grid (shown)",make:c=>{const s=N(3,4,5,6),k=N(4,8,12,20),pos=pick([...Array(s*s).keys()],k),e=pick(EM,k),g={};pos.forEach((p,i)=>g[p]=e[i]);const opt=shuf([...e,...pick(EM.filter(x=>!e.includes(x)),3)]),st=`grid-template-columns:repeat(${s},1fr)`,cells=[...Array(s*s).keys()];const show=`<div class="gr" style="${st}">${cells.map(i=>`<div>${g[i]||""}</div>`).join("")}</div>`;return{mem:k*4+8,show,ask:`<p class="mu">Put each picture back where it was.</p><div class="gr" style="${st}">${cells.map(i=>`<select data-a><option value=""></option>${opt.map(o=>`<option>${o}</option>`).join("")}</select>`).join("")}</div>`,score(v){let ok=0,bad=0;cells.forEach(i=>{if(g[i]){if(v[i]==g[i])ok++}else if(v[i])bad++});return{g:Math.max(0,ok-bad),m:k,key:show}}}}},
heard:{n:"Words heard (listen)",make:c=>{const k=N(6,10,25,40),it=pick(W,k);return{mem:k*4+15,say:it,show:`<p>Listen carefully. Each word is spoken once per play.</p><button class="pri" onclick="speak()">🔊 Play words</button> <span id="pl" class="mu">2 plays left</span>`,ask:`<textarea data-a rows="5" placeholder="Type the words you heard"></textarea>`,score(v){const s=new Set(v[0].toLowerCase().split(/[^a-z]+/));return{g:it.filter(w=>s.has(w)).length,m:k,key:it.join(", ")}}}}},
story:{n:"Passage recall (read)",make:c=>{const j=J(c)&&lv==1,p=pick(NM,2),n=2+Math.floor(Math.random()*8),col=R(CO),it=pick(IT,2),ct=pick(CT,2),d=R(DY),n2=11+Math.floor(Math.random()*30);let s=`${p[0]} bought ${n} ${col} ${it[0]} in ${ct[0]} on ${d}.`,q=[["Who bought?",p[0]],["How many were bought?",n],["What colour were they?",col],["In which city?",ct[0]]];if(!j){s+=` Then ${p[1]} sold ${n2} ${it[1]} in ${ct[1]}.`;q.push(["On which day?",d],["Who sold?",p[1]],["How many were sold?",n2],["Which items were sold?",it[1]])}return{mem:j?25:50,show:`<p style="font-size:1.15rem">${s}</p>`,ask:q.map(x=>`<label style="text-transform:none">${x[0]} <input data-a></label>`).join(""),score(v){return{g:q.filter((x,i)=>v[i].trim().toLowerCase()==String(x[1]).toLowerCase()).length,m:q.length,key:s}}}}}
};
const FN=NM.concat("Rahul Sneha Anil Priya Vishnu Lakshmi Faisal Aisha Gopal Rekha Suma Nithin Abin Rosy Jacob Salim Neha Varun Divya Anjali Rohit Shifa Ajay Sarah Jomon".split(" ")),LN="Nair Menon Pillai Kurup Warrier Thomas Mathew Joseph Rahman Hameed Iyer Nambiar Panicker Varghese George Sharma Das Bose Rao Khan Reddy Gupta Mehta Shah Fernandez Pereira Xavier Samuel Kutty Mohan Pai Shenoy Kamath Bhat Naik Kaur Singh Verma Jain Ali".split(" ");
const VB="carried found sold painted counted repaired packed delivered".split(" "),AJ="old heavy small bright wooden broken".split(" "),PP="near behind beside under outside".split(" "),PL="temple market bridge station school harbour library".split(" ");
const GB="She has lived here since 2010.|since/He is good at mathematics.|at/They arrived on Monday morning.|on/I have an umbrella.|an/Neither of the boys was late.|was/If it rains, we will stay home.|will/The book was written by Tagore.|by/She is taller than her brother.|than/We have been waiting for two hours.|for/He asked me whether I had finished.|whether/Each of the girls has her own pen.|has/I look forward to meeting you.|to/Although he was tired, he kept working.|Although/She said that she would come.|would/The news is surprising.|is/Between you and me, it is secret.|Between/He did not know where she lived.|lived/Hardly had we left when it rained.|Hardly/Few people attended the meeting.|Few/My brother, who lives abroad, is a doctor.|who/Everyone has finished their work.|has/They are fond of music.|of/The sun rises in the east.|rises/I wish I were a bird.|were/Please sit beside me.|beside/He apologised for being late.|for/She plays the violin well.|the/By next year, I will have graduated.|graduated".split("/");
const sg=k=>Array.from({length:k},()=>{const w=R(NM),v=R(VB),n=2+Math.floor(Math.random()*40),m=`${R(AJ)} ${R(IT)} ${R(PP)} the`,p=R(PL);return{n,p,a:`${w} ${v} `,m:` ${m} `,f:`${w} ${v} ${n} ${m} ${p}.`}});
const sAsk=l=>`<p class="mu">Fill in the number and the place.</p>`+l.map(o=>`<div style="margin:6px 0">${o.a}<input data-a style="width:4em;display:inline-block">${o.m}<input data-a style="width:8em;display:inline-block"></div>`).join("");
const sSc=l=>v=>{let g=0;l.forEach((o,i)=>{if(v[2*i].trim()==o.n)g++;if(v[2*i+1].trim().toLowerCase()==o.p)g++});return{g,m:2*l.length,key:l.map(o=>o.f).join("<br>")}};
Object.assign(T,{
names:{n:"Full names (read)",make:c=>{const k=N(6,10,25,40),a=pick(FN,k),b=pick(LN,k),it=a.map((x,i)=>x+" "+b[i]);return{mem:k*4+10,show:`<div class="chips">${it.map(w=>`<span>${w}</span>`).join("")}</div>`,ask:`<textarea data-a rows="8" placeholder="Type the full names you remember, one per line"></textarea>`,score(v){const t=v[0].toLowerCase().replace(/[^a-z]+/g," ");return{g:it.filter(w=>t.includes(w.toLowerCase())).length,m:k,key:it.join(", ")}}}}},
order:{n:"Words in order (read)",make:c=>{const k=N(8,12,25,35),it=pick(W,k);return{mem:k*4+10,show:`<ol style="text-align:left;columns:2;text-transform:capitalize">${it.map(w=>`<li>${w}</li>`).join("")}</ol>`,ask:`<textarea data-a rows="8" placeholder="Type the words in the SAME order"></textarea>`,score(v){const x=v[0].toLowerCase().split(/[^a-z]+/).filter(Boolean);return{g:it.filter((w,i)=>x[i]==w).length,m:k,key:it.map((w,i)=>`${i+1}. ${w}`).join(" · ")}}}}},
codes:{n:"Codes and phone numbers (shown)",make:c=>{const k=N(4,6,10,15),L=()=>String.fromCharCode(65+Math.floor(Math.random()*26)),D=n=>Array.from({length:n},()=>Math.floor(Math.random()*10)).join(""),it=Array.from({length:k},(_,i)=>i%2?`+91 ${D(5)} ${D(5)}`:`${L()}${L()}-${D(3)}-${L()}`),cl=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,"");return{mem:k*6+8,show:it.map(x=>`<div class="pr">${x}</div>`).join(""),ask:`<textarea data-a rows="8" placeholder="One per line, in the same order"></textarea>`,score(v){const x=v[0].split("\n").map(cl).filter(Boolean);return{g:it.filter((w,i)=>x[i]==cl(w)).length,m:k,key:it.join(", ")}}}}},
table:{n:"Data table: name, city, number (shown)",make:c=>{const k=N(4,6,10,14),n=pick(FN,k),ct=Array.from({length:k},()=>R(CT)),nu=Array.from({length:k},()=>10+Math.floor(Math.random()*90));return{mem:k*7+8,show:`<table style="text-transform:capitalize;margin:auto">${n.map((x,i)=>`<tr><td><b>${x}</b></td><td>${ct[i]}</td><td>${nu[i]}</td></tr>`).join("")}</table>`,ask:n.map(x=>`<label>${x} <input data-a placeholder="city"> <input data-a placeholder="number"></label>`).join(""),score(v){let g=0;n.forEach((x,i)=>{if(v[2*i].trim().toLowerCase()==ct[i].toLowerCase())g++;if(v[2*i+1].trim()==nu[i])g++});return{g,m:2*k,key:n.map((x,i)=>`${x}: ${ct[i]}, ${nu[i]}`).join(" · ")}}}}},
sent:{n:"Sentences (read)",make:c=>{const l=sg(N(4,6,12,18));return{mem:l.length*9+8,show:l.map(o=>`<p style="margin:6px 0">${o.f}</p>`).join(""),ask:sAsk(l),score:sSc(l)}}},
hsent:{n:"Sentences heard (listen)",make:c=>{const l=sg(N(3,5,8,12));return{mem:l.length*10+20,say:l.map(o=>o.f),show:`<p>Listen carefully. The sentences are spoken once per play.</p><button class="pri" onclick="speak()">🔊 Play sentences</button> <span id="pl" class="mu">2 plays left</span>`,ask:sAsk(l),score:sSc(l)}}},
hnum:{n:"Numbers heard (listen)",make:c=>{const k=N(5,7,10,14),d=Array.from({length:k},()=>Math.floor(Math.random()*10)),s=d.join("");return{mem:k*2+15,say:d.map(String),show:`<p>Listen carefully. Digits are spoken one by one.</p><button class="pri" onclick="speak()">🔊 Play digits</button> <span id="pl" class="mu">2 plays left</span>`,ask:`<input data-a inputmode="numeric" placeholder="Type the digits in order">`,score(v){const x=v[0].replace(/\D/g,"");return{g:[...s].filter((q,i)=>x[i]==q).length,m:k,key:s}}}}},
grammar:{n:"Grammar sentences (read)",make:c=>{const it=pick(GB,N(5,8,16,24)).map(s=>s.split("|")),bl=(s,a)=>s.split(" ").map(t=>t.replace(/[.,]/g,"").toLowerCase()==a.toLowerCase()?"____":t).join(" ");return{mem:it.length*6+10,show:it.map(x=>`<p style="margin:6px 0">${x[0]}</p>`).join(""),ask:`<p class="mu">Type the missing word in each sentence.</p>`+it.map(x=>`<label style="text-transform:none"><span style="flex:3">${bl(x[0],x[1])}</span> <input data-a></label>`).join(""),score(v){return{g:it.filter((x,i)=>v[i].trim().toLowerCase()==x[1].toLowerCase()).length,m:it.length,key:it.map(x=>x[0]).join("<br>")}}}}}
});
const EX=["words","num","pairs","grid","heard","story"],examSet=()=>lv==1?EX:["words","names","num","order","table","heard","sent","grammar"];
let db=null,usr=null,dl=null,ME={id:"guest",name:"Candidate",admin:false},A=[],cat=ls("mt_cat")||"Junior",tab="home",run=null,sel=null,K=[],flt="All";
const av=l=>l.length?Math.round(l.reduce((s,a)=>s+a.pct,0)/l.length):"–",mine=()=>A.filter(a=>a.uid==ME.id);
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function go(t){run=null;sel=null;try{speechSynthesis.cancel()}catch(e){}tab=t;draw()}
function setCat(c){cat=c;ls("mt_cat",c);draw()}
function speak(){const r=run;if(!r||r.plays>=2||!window.speechSynthesis)return;r.plays++;speechSynthesis.cancel();r.c.say.forEach(w=>{const u=new SpeechSynthesisUtterance(w+".");u.rate=.75;speechSynthesis.speak(u)});$("#pl").textContent=(2-r.plays)+" plays left"}
function next(){const r=run,k=r.q[r.i];r.c=T[k].make(cat);r.phase="mem";r.plays=0;r.tEnd=Date.now()+r.c.mem*1000}
function startPractice(k){run={mode:"practice",q:[k],i:0,rs:[]};next();tab="run";draw()}
function startExam(){run={mode:"exam",q:examSet(),i:0,rs:[],gEnd:Date.now()+18e5,ex:Date.now()};next();tab="run";draw()}
function toAsk(){if(!run||run.phase!="mem")return;try{speechSynthesis.cancel()}catch(e){}run.phase="ask";run.t0=Date.now();draw()}
function rec(k,res){const o={uid:ME.id,name:ME.name,cat,lv,mode:run.mode,type:k,got:res.g,max:res.m,pct:Math.round(100*res.g/res.m),day:new Date().toLocaleDateString("en-CA"),ts:Date.now(),secs:Math.round((Date.now()-run.t0)/1000)};if(run.ex)o.ex=run.ex;if(db)db.collection("attempts").add(o).catch(()=>{});else{A.push(o);ls("mt_a",JSON.stringify(A))}}
function grade(){const r=run,k=r.q[r.i],v=[...document.querySelectorAll("[data-a]")].map(e=>e.value),res=r.c.score(v);rec(k,res);r.rs.push({k,res});return res}
function submit(){const r=run,res=grade();if(r.mode=="exam"){if(r.i<r.q.length-1){r.i++;next()}else r.phase="done"}else{r.res=res;r.phase="res"}draw()}
function finishExam(){if(run.phase=="ask")grade();run.phase="done";run.timeup=true;draw()}
setInterval(()=>{if(tab!="run"||!run)return;const n=Date.now();if(run.mode=="exam"&&run.phase!="done"){const l=run.gEnd-n,e=$("#gt");if(e)e.textContent=fmt(l);if(l<=0)return finishExam()}if(run.phase=="mem"){const e=$("#tm");if(e)e.textContent=fmt(run.tEnd-n);if(run.tEnd<=n)toAsk()}},250);
function vHome(){return`<div class="card"><h2>Category</h2><button class="sg ${J(cat)?"on":""}" onclick="setCat('Junior')">Junior</button> <button class="sg ${!J(cat)?"on":""}" onclick="setCat('Senior')">Senior</button>
<p class="mu">Memory Test · Category O (offstage, pool level) · 30 minutes · skill: reasoning · 1 candidate. Memorise what is read, shown or heard, then reproduce it.</p><h2 style="margin-top:12px">Difficulty</h2>${["Standard","Hard (50+ words at once)","Extreme"].map((x,i)=>`<button class="sg ${lv==i+1?"on":""}" onclick="setLv(${i+1})">${x}</button>`).join(" ")}</div>
<div class="card"><h2>Practice mode</h2><p class="mu">Pick a task. You get instant marks and the correct answer after each attempt.</p><div class="grid">${Object.keys(T).map(k=>`<button onclick="startPractice('${k}')">${T[k].n}</button>`).join("")}</div></div>
<div class="card"><h2>Examination mode</h2><p class="mu">Six tasks at Standard, eight at Hard or Extreme (read, shown, heard, reasoning) on one 30-minute clock. No answer key until the end. Every task is saved for your mentor.</p><button class="pri" onclick="startExam()">Start exam</button></div>`}
function vRun(){const r=run,t=T[r.q[r.i]];let h=`<div class="card"><div class="row"><b>${r.mode=="exam"?`Task ${Math.min(r.i+1,r.q.length)}/${r.q.length} · `:""}${t.n}</b>${r.mode=="exam"&&r.phase!="done"?`<span class="tag">Exam time left <b id="gt"></b></span>`:""}</div>`;
if(r.phase=="mem")h+=`<p class="mu">Memorise · time left <b id="tm"></b></p><div class="stage">${r.c.show}</div><button class="pri" onclick="toAsk()">I am ready</button>`;
else if(r.phase=="ask")h+=`<p class="mu">Recall</p>${r.c.ask}<button class="pri" onclick="submit()">${r.mode!="exam"?"Submit":r.i<r.q.length-1?"Submit and next":"Finish exam"}</button>`;
else if(r.phase=="res"){const x=r.res,p=Math.round(100*x.g/x.m);h+=`<div class="sc ${p>=70?"ok":"bad"}">${x.g}/${x.m} · ${p}%</div><p class="mu">Correct answer</p><div class="stage">${x.key}</div><button class="pri" onclick="startPractice('${r.q[0]}')">Try again</button> <button onclick="go('home')">Back</button>`}
else{const g=r.rs.reduce((s,x)=>s+x.res.g,0),m=r.rs.reduce((s,x)=>s+x.res.m,0);h+=`<h2>${r.timeup?"Time up · ":""}Exam finished</h2><div class="sc">${g}/${m} · ${m?Math.round(100*g/m):0}%</div><table>${r.rs.map(x=>`<tr><td>${T[x.k].n}</td><td>${x.res.g}/${x.res.m}</td></tr>`).join("")}</table><button class="pri" onclick="go('prog')">See my progress</button>`}
return h+"</div>"}
function chart(L){const d={};L.forEach(a=>{(d[a.day]??={p:[],e:[]})[a.mode=="exam"?"e":"p"].push(a.pct)});const ks=Object.keys(d).sort().slice(-14);if(!ks.length)return`<p class="mu">No attempts yet.</p>`;const w=600/ks.length,a=l=>l.length?Math.round(l.reduce((x,y)=>x+y,0)/l.length):null;let s=`<svg viewBox="0 0 600 185" class="ch">`;ks.forEach((k,i)=>{[["p","var(--ac)"],["e","var(--ok)"]].forEach(([t,c],j)=>{const v=a(d[k][t]);if(v==null)return;const h=v*1.3,x=i*w+w*.12+j*w*.38,b=w*.36;s+=`<rect x="${x}" y="${150-h}" width="${b}" height="${h}" rx="3" fill="${c}"/><text x="${x+b/2}" y="${145-h}" text-anchor="middle" font-size="10" fill="var(--tx)">${v}</text>`});s+=`<text x="${i*w+w/2}" y="170" text-anchor="middle" font-size="10" fill="var(--mu)">${k.slice(5)}</text>`});return s+`</svg><div class="lg"><i style="background:var(--ac)"></i>Practice avg % <i style="background:var(--ok)"></i>Exam avg %</div>`}
function vProg(L){if(!L.length)return`<div class="card"><p class="mu">No attempts yet. Try a practice task first.</p></div>`;const pr=L.filter(a=>a.mode!="exam"),ex=L.filter(a=>a.mode=="exam"),ty=Object.keys(T).map(k=>[k,L.filter(a=>a.type==k)]).filter(x=>x[1].length);
return`<div class="card"><div class="st"><div><b>${L.length}</b>attempts</div><div><b>${new Set(L.map(a=>a.day)).size}</b>days practised</div><div><b>${av(L)}%</b>overall avg</div><div><b>${av(pr)}%</b>practice avg</div><div><b>${av(ex)}%</b>exam avg</div><div><b>${Math.max(...L.map(a=>a.pct))}%</b>best</div></div></div>
<div class="card"><h2>Day by day</h2>${chart(L)}</div>
<div class="card"><h2>By task</h2><div class="ov"><table>${ty.map(x=>`<tr><td>${T[x[0]].n}</td><td>${x[1].length} tries</td><td><b>${av(x[1])}%</b></td></tr>`).join("")}</table></div></div>
<div class="card"><h2>Recent attempts</h2><div class="ov"><table><tr><th>When</th><th>Cat.</th><th>Mode</th><th>Task</th><th>Score</th><th>Time</th></tr>${[...L].sort((a,b)=>b.ts-a.ts).slice(0,20).map(a=>`<tr><td>${new Date(a.ts).toLocaleString([],{dateStyle:"short",timeStyle:"short"})}</td><td>${a.cat}${a.lv>1?" · L"+a.lv:""}</td><td>${a.mode}</td><td>${T[a.type]?T[a.type].n:a.type}</td><td>${a.got}/${a.max} (${a.pct}%)</td><td>${a.secs}s</td></tr>`).join("")}</table></div></div>`}
function vAdmin(){if(sel){const L=A.filter(a=>a.uid==sel),n=L.length?esc(L[L.length-1].name):"";return`<button onclick="sel=null;draw()">← All candidates</button><h2 style="margin-top:12px">${n}</h2>`+vProg(L)}
const g={};A.forEach(a=>(g[a.uid]??=[]).push(a));K=Object.keys(g).filter(k=>flt=="All"||g[k][g[k].length-1].cat==flt);
return`<div class="card"><div class="row"><h2>Candidates</h2><span>${["All","Junior","Senior"].map(f=>`<button class="sg ${flt==f?"on":""}" onclick="flt='${f}';draw()">${f}</button>`).join(" ")} <button onclick="csv()">Download CSV</button></span></div>${K.length?`<div class="ov"><table><tr><th>Name</th><th>Cat.</th><th>Days</th><th>Attempts</th><th>Avg</th><th>Exam avg</th><th>Last</th><th></th></tr>${K.map((k,i)=>{const L=g[k].sort((a,b)=>a.ts-b.ts),l=L[L.length-1];return`<tr><td>${esc(l.name)}</td><td>${l.cat}</td><td>${new Set(L.map(a=>a.day)).size}</td><td>${L.length}</td><td>${av(L)}%</td><td>${av(L.filter(a=>a.mode=="exam"))}%</td><td>${l.day}</td><td><button onclick="sel=K[${i}];draw()">View</button></td></tr>`}).join("")}</table></div>`:`<p class="mu">No attempts recorded yet. Ask candidates to open this page and practise.</p>`}</div>`}
async function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',d=["name,category,level,mode,task,got,max,percent,day,seconds"].concat(A.map(a=>[a.name,a.cat,a.lv||1,a.mode,a.type,a.got,a.max,a.pct,a.day,a.secs].map(q).join(","))).join("\n");try{dl=dl||await claude.use("downloads");if(dl)await dl.save({filename:"memory-test-results.csv",data:d})}catch(e){}}
function draw(){const t=[["home","Practice and exam"],["prog","My progress"]];if(ME.admin)t.push(["admin","Admin"]);$("#nav").innerHTML=t.map(x=>`<button class="tb ${tab==x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");$("#who").textContent=ME.name+(ME.admin?" · Admin":"");$("#app").innerHTML=tab=="run"&&run?vRun():tab=="prog"?vProg(mine()):tab=="admin"&&ME.admin?vAdmin():vHome()}
(async()=>{try{const c=window.claude;if(c){usr=await c.use("user");if(usr){const m=await usr.me();ME={id:m.id||"guest",name:m.name||"Candidate",admin:!!(await usr.isOwner()||await usr.canEdit())}}db=await c.use("db")}}catch(e){}
if(db){db.collection("attempts").onSnapshot(s=>{A=s.docs.map(d=>d.data());if(tab!="run")draw()},()=>{})}else{try{A=JSON.parse(ls("mt_a")||"[]")}catch(e){}}
draw()})();
draw();
</script></body></html>
